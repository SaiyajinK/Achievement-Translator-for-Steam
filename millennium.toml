[plugin]
id = "com.saiyajink.achievementtranslator"
name = "Achievement Translator"
version = "1.0.0"
author = "SaiyajinK"
description = "Translate achievement titles and descriptions into the Steam client language on demand."

[backend]
entry = "backend/main.lua"
sources = ["backend/**/*.lua"]

[frontend]
entry = "frontend/index.tsx"

[webkit]
entry = "webview/preload.ts"

[compiler]
output_path = "auto"

[dev]
auto_restart = true
reload_steamui_when = "frontend"
